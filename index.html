<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitungan ACC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

</head><body><title>Hitungan & Benefit ACC</title>
<meta name="theme-color" content="#123a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: satu kolom sempit (≤560px) seperti aplikasi HP; tab di atas, angka hasil besar di kartu hasil. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#f5f8f7; --fg:#14262c; --muted:#5d7178; --line:#d3dedc;
  --accent:#0f6b6b; --accent-ink:#ffffff; --accent-soft:#dcefed; --head:#123a4a;
  --good:#1d7a43; --good-soft:#dff3e6; --warn:#a35c00; --warn-soft:#fbecd5; --bad:#b3261e; --bad-soft:#fbe1de;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#142226; --sunk:#101c1f; --fg:#e3eeec; --muted:#93a8ad; --line:#26393d;
  --accent:#4fbdb3; --accent-ink:#06201f; --accent-soft:#173a3a; --head:#0a2530;
  --good:#6fd39a; --good-soft:#163526; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --surface:#142226; --sunk:#101c1f; --fg:#e3eeec; --muted:#93a8ad; --line:#26393d;
  --accent:#4fbdb3; --accent-ink:#06201f; --accent-soft:#173a3a; --head:#0a2530;
  --good:#6fd39a; --good-soft:#163526; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
.top{background:var(--head);color:#fff;padding:12px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-size:17px;margin:0;font-weight:800}
.top .sub{font-size:12px;opacity:.75;text-align:right}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:10px auto 0}
.tabs button{background:transparent;border:0;color:#cfe3e3;font:700 13px var(--f-ui);padding:10px 2px;border-radius:10px 10px 0 0;cursor:pointer;line-height:1.15}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg)}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:800}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0}
input,select{font:500 16px var(--f-ui);color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;min-width:0}
input.num{font-family:var(--f-num);text-align:right}
input.big{font-size:22px;font-weight:700;padding:12px}
input[readonly]{background:var(--accent-soft);border-color:transparent;font-weight:700}
input.over{border-color:var(--bad);background:var(--bad-soft)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font:700 13.5px var(--f-ui);padding:9px 2px;border-radius:7px;cursor:pointer;line-height:1.1}
.seg button small{display:block;font-weight:600;font-size:10.5px;opacity:.7;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.dpwrap{display:flex;gap:8px;align-items:stretch}
.dpwrap .seg{flex:0 0 auto;width:96px}
.dpwrap input{flex:1}

/* Kartu hasil */
.res{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:16px 14px 14px}
.res .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.res .v{font-family:var(--f-num);font-weight:700;font-size:clamp(28px,8.5vw,38px);line-height:1.15;overflow-wrap:anywhere;color:var(--fg)}
.res .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats div{background:var(--sunk);border-radius:9px;padding:9px 10px;min-width:0}
.stats span{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.stats b{font-family:var(--f-num);font-size:15.5px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--fg);padding:3px 9px;border-radius:999px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.alerts:empty{display:none}
.alert{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--accent);padding:4px 0}
table.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.rows td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.rows td.v{text-align:right;font-family:var(--f-num);white-space:nowrap;padding-left:8px}
table.rows td small{color:var(--muted);font-size:11.5px;display:block}
table.rows tr.sum td{border-bottom:0;border-top:2px solid var(--fg);font-weight:800;padding-top:7px}
table.rows tr.sec td{border-bottom:0;padding-top:12px;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions.one{grid-template-columns:1fr}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:800 14px var(--f-ui);padding:11px 10px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.meter{height:12px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;position:relative;overflow:hidden;margin:10px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:999px}
.meter i.bad{background:var(--bad)}
.meter s{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--fg);text-decoration:none}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-num)}
.tbl-wrap{overflow-x:auto}
table.ref{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.ref th,table.ref td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-num)}
table.ref th{font-size:11px;color:var(--muted);font-family:var(--f-ui)}
table.ref td:first-child,table.ref th:first-child{text-align:left}
table.ref td.hit{background:var(--accent-soft);font-weight:800}
.ctx{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ctx b{color:var(--fg)}
[data-tab-view]{display:none} [data-tab-view].on{display:block}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <div class="in">
    <h1>Hitungan ACC</h1>
    <div class="sub" id="topSub">ACC MANADO</div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="angs" aria-selected="true">Cari Angsuran</button>
    <button role="tab" data-tab="dp" aria-selected="false">Cari DP</button>
    <button role="tab" data-tab="pdc" aria-selected="false">PDC</button>
    <button role="tab" data-tab="set" aria-selected="false">Pengaturan</button>
  </nav>
</header>

<main>
  <!-- UNIT (dipakai Cari Angsuran & Cari DP) -->
  <section class="panel" data-tab-view="angs dp">
    <div class="fields">
      <label class="f">Type
        <input id="type" list="typeList" placeholder="cth. AYLA, GRAN MAX PU" autocomplete="off">
      </label>
      <label class="f">Harga OTR (Rp)<input id="otr" class="num money" inputmode="numeric" value="183.100.000"></label>
      <datalist id="typeList"><option value="AYLA"><option value="SIGRA"><option value="XENIA"><option value="ROCKY"><option value="TERIOS"><option value="SIRION"><option value="LUXIO"><option value="GRAN MAX PU"><option value="GRAN MAX BV"><option value="GRAN MAX MB"></datalist>
      <div class="full">
        <div class="lbl">Tenor</div>
        <div class="seg" id="tenorSeg">
          <button data-v="1" aria-pressed="false">1 th<small>12x</small></button>
          <button data-v="2" aria-pressed="false">2 th<small>24x</small></button>
          <button data-v="3" aria-pressed="false">3 th<small>36x</small></button>
          <button data-v="4" aria-pressed="false">4 th<small>48x</small></button>
          <button data-v="5" aria-pressed="true">5 th<small>60x</small></button>
        </div>
      </div>
      <div class="full">
        <div class="seg" id="addm"><button aria-pressed="false" data-v="ADDM">ADDM<small>bayar di muka</small></button><button aria-pressed="true" data-v="ADDB">ADDB<small>bayar di belakang</small></button></div>
      </div>
    </div>
  </section>

  <!-- CARI ANGSURAN -->
  <section class="panel" data-tab-view="angs">
    <div class="lbl">DP</div>
    <div class="dpwrap">
      <div class="seg" id="dpMode"><button aria-pressed="true" data-v="pct">%</button><button aria-pressed="false" data-v="rp">Rp</button></div>
      <input id="dpPct" class="num big" type="number" step="0.01" inputmode="decimal" value="20">
      <input id="dpRp" class="num big money" inputmode="numeric" value="36.620.000" hidden>
    </div>
    <p class="hint" id="dpEcho"></p>
  </section>
  <section class="res" data-tab-view="angs" id="resAngs"></section>

  <!-- CARI DP -->
  <section class="panel" data-tab-view="dp">
    <label class="f">Angsuran yang diinginkan (Rp / bulan)
      <input id="tAngs" class="num big money" inputmode="numeric" value="4.000.000">
    </label>
  </section>
  <section class="res" data-tab-view="dp" id="resDp"></section>

  <!-- PDC -->
  <div class="ctx" data-tab-view="pdc" id="pdcCtx"></div>
  <section class="panel" data-tab-view="pdc">
    <h2>Benefit PDC</h2>
    <div class="fields">
      <label class="f">PDC (% / tahun, maks 2)<input id="bPdc" class="num big" type="number" step="0.01" inputmode="decimal" value="2"></label>
      <div><div class="lbl">Bunga ke konsumen</div><div class="v" style="font:700 22px var(--f-num);padding-top:10px" id="pdcBunga">–</div></div>
    </div>
    <p class="hint" id="pdcInfo"></p>
    <div class="alerts" id="pdcAlert"></div>
  </section>
  <section class="panel" data-tab-view="pdc">
    <h2>Cek OJK (maks 15%)</h2>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font:700 30px var(--f-num)" id="ojkPct">–</b><span class="pill" id="ojkPill"></span></div>
    <div class="meter"><i id="ojkBar"></i><s></s></div>
    <div class="scale"><span>0%</span><span>15%</span><span>30%</span></div>
    <table class="rows" style="margin-top:12px"><tbody id="benRows"></tbody></table>
    <details>
      <summary>Refund, provisi &amp; split salesman</summary>
      <div class="fields" style="margin-top:8px">
        <label class="f">Refund asuransi (%)<input id="refund" class="num" type="number" step="0.1" inputmode="decimal" value="0"></label>
        <label class="f">Provisi (% dari PH)<input id="provisi" class="num" type="number" step="0.1" inputmode="decimal" value="0"></label>
        <label class="f">Split PDC (%)<input id="spPdc" class="num" type="number" step="1" inputmode="decimal" value="49"></label>
        <label class="f">Split selisih admin (%)<input id="spAdm" class="num" type="number" step="1" inputmode="decimal" value="0"></label>
        <label class="f">Split refund ass (%)<input id="spRef" class="num" type="number" step="1" inputmode="decimal" value="0"></label>
        <label class="f">Split provisi (%)<input id="spProv" class="num" type="number" step="1" inputmode="decimal" value="0"></label>
      </div>
    </details>
  </section>

  <!-- PENGATURAN -->
  <section class="panel" data-tab-view="set">
    <h2>Cabang &amp; bunga</h2>
    <div class="fields">
      <label class="f full">Cabang ACC<select id="cabang"></select></label>
      <label class="f">Kategori rate
        <select id="kat"><option>LUXURY</option><option selected>REGULAR 1</option><option>REGULAR 2</option><option>COMMERCIAL 1</option><option>COMMERCIAL 2</option></select>
      </label>
      <label class="f">Bunga counter (%)<input id="bCounter" class="num" type="number" step="0.01" inputmode="decimal" value="8"></label>
      <div class="full"><div class="seg" id="bMode"><button aria-pressed="true" data-v="auto">Otomatis ikut DP</button><button aria-pressed="false" data-v="manual">Isi manual</button></div></div>
      <p class="hint full" id="katInfo" style="margin:0">Kategori mengikuti type secara otomatis, bisa diganti di sini.</p>
    </div>
  </section>
  <section class="panel" data-tab-view="set">
    <h2>Asuransi</h2>
    <div class="fields">
      <label class="f full">Jenis kendaraan
        <select id="jenis"><option>PASSENGER</option><option>TRUCK / PU / BOX</option><option>BUS / MICROBUS</option></select>
      </label>
      <label class="f full">Jenis asuransi<select id="cover"></select></label>
      <label class="f full">Pembayaran asuransi
        <select id="insPay"><option>KREDIT FULL</option><option>TUNAI TAHUN 1</option><option>TUNAI FULL</option></select>
      </label>
      <label class="f">Premi ACP / jiwa<select id="acp"><option>TIDAK</option><option>YA</option></select></label>
      <label class="f">ACP dibayar<select id="acpPay"><option>KREDIT</option><option>TUNAI</option></select></label>
      <p class="hint full" id="insInfo" style="margin:0"></p>
    </div>
  </section>
  <section class="panel" data-tab-view="set">
    <h2>Biaya &amp; lain-lain</h2>
    <div class="fields">
      <label class="f">Discount dealer (Rp)<input id="disc" class="num money" inputmode="numeric" value="0"></label>
      <label class="f">Biaya admin (Rp)<input id="admin" class="num money" inputmode="numeric" value="950.000"></label>
      <label class="f">Biaya polis (Rp)<input id="polis" class="num money" inputmode="numeric" value="50.000"></label>
      <label class="f">Standar admin (Rp)<input id="admStd" class="num money" inputmode="numeric" value="1.600.000"></label>
      <label class="f">Porsi asuransi ACC (%)<input id="assAcc" class="num" type="number" step="1" inputmode="decimal" value="25"></label>
      <label class="f">Nama konsumen (WA)<input id="nama" placeholder="opsional"></label>
    </div>
  </section>
  <section class="panel" data-tab-view="set">
    <h2>Tabel counter rate</h2>
    <p class="hint" style="margin:0 0 8px" id="crInfo"></p>
    <div class="tbl-wrap"><table class="ref" id="crTbl"></table></div>
    <table class="rows" style="margin-top:10px"><tbody id="effRows"></tbody></table>
    <div class="actions one"><button class="btn ghost" id="btnReset">Kembalikan pengaturan awal</button></div>
  </section>
</main>
<div class="toast" id="toast"></div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const COVERS = {
  5:['5 thn AR','4 thn AR, 1 thn TLO','3 thn AR, 2 thn TLO','2 thn AR, 3 thn TLO','1 thn AR, 4 thn TLO','5 thn TLO'],
  4:['4 thn AR','3 thn AR, 1 thn TLO','2 thn AR, 2 thn TLO','1 thn AR, 3 thn TLO','4 thn TLO'],
  3:['3 thn AR','2 thn AR, 1 thn TLO','1 thn AR, 2 thn TLO','3 thn TLO'],
  2:['2 thn AR','1 thn AR, 1 thn TLO','2 thn TLO'],
  1:['1 thn AR','1 thn TLO']
};
function fillCabang(){
  const sel = $('cabang'); let area = null, og = null;
  DATA.cab.forEach(([a,c,w,l]) => {
    if (a !== area){ og = document.createElement('optgroup'); og.label = a; sel.appendChild(og); area = a; }
    const o = document.createElement('option'); o.value = c; o.textContent = `${c} · ${w} · ${l}`; og.appendChild(o);
  });
  sel.value = 'MANADO';
}
function fillCover(keep){
  const t = +segVal('tenorSeg'), sel = $('cover'), prev = keep ?? sel.value;
  sel.innerHTML = COVERS[t].map(c=>`<option>${c}</option>`).join('');
  const truck = $('jenis').value !== 'PASSENGER';
  if (COVERS[t].includes(prev)) sel.value = prev;
  else sel.value = truck ? `${t} thn TLO` : (COVERS[t].find(c=>c.startsWith('1 thn AR')) || COVERS[t][0]);
}

/* ---------- mesin hitung (mengikuti sheet "Komputer") ---------- */
function cabInfo(){ const c = DATA.cab.find(x=>x[1]===$('cabang').value) || DATA.cab[0]; return {cab:c[1], wil:c[2], lvl:c[3]}; }
function insRate(wil, cover, jenis, otrNet){
  const row = DATA.ins[wil][cover]; if (!row) return 0;
  if (jenis === 'TRUCK / PU / BOX') return row.t;
  if (jenis === 'BUS / MICROBUS') return row.b;
  const br = DATA.ins.brackets; let i = br.findIndex(b => otrNet < b + 1); if (i < 0) i = br.length-1;
  return row.p[i];
}
function bracketOf(otrNet){ const br = DATA.ins.brackets; let i = br.findIndex(b => otrNet < b + 1); if (i<0) i = br.length-1; return br[i]; }

function inputs(){
  const otr = parseRp($('otr').value), disc = parseRp($('disc').value);
  return {
    otr, disc, otrNet: otr - disc,
    dpMode: segVal('dpMode'),
    dpPct: num('dpPct')/100, dpRp: parseRp($('dpRp').value),
    tenor: +segVal('tenorSeg'),
    addm: segVal('addm'),
    bCounter: num('bCounter')/100, bPdc: num('bPdc')/100,
    bAuto: segVal('bMode') === 'auto', kat: $('kat').value,
    jenis: $('jenis').value, cover: $('cover').value, insPay: $('insPay').value,
    acp: $('acp').value, acpPay: $('acpPay').value,
    admin: parseRp($('admin').value), polis: parseRp($('polis').value),
    provisi: num('provisi')/100, ...cabInfo()
  };
}

function calc(p, dpOverride){
  const r = {};
  r.otrNet = p.otrNet;
  r.dp = dpOverride != null ? dpOverride : (p.dpMode === 'pct' ? p.dpPct * p.otrNet : p.dpRp);
  r.dpPct = p.otrNet ? r.dp / p.otrNet : 0;
  r.ph = p.otrNet - r.dp;
  r.cr = counterRate(p, r.dpPct, p.kat);
  r.crLow = null;
  if (!r.cr){ // DP di bawah band terendah: pakai rate band terendah yang tersedia (paling mahal)
    const ti = [12,24,36,48,60].indexOf(p.tenor*12) + 1, add = {C1:0,C2:.0025,C3:.005,C4:.01}[p.lvl] || 0;
    const rw = DATA.cr[p.addm][p.kat].filter(x => x[ti] != null).pop();
    if (rw) r.crLow = {rate: rw[ti] + add, band: rw[0]};
  }
  r.bAutoOk = p.bAuto && !!(r.cr || r.crLow);
  r.bCounter = r.bAutoOk ? (r.cr || r.crLow).rate : p.bCounter;
  r.bunga = r.bCounter + p.bPdc;
  r.n = p.tenor * 12;
  // Asuransi
  r.insRate = insRate(p.wil, p.cover, p.jenis, p.otrNet);
  r.insFull = r.insRate * p.otrNet;
  r.yr1Cover = /^\d thn TLO$/.test(p.cover) ? '1 thn TLO' : '1 thn AR';
  r.insYr1 = insRate(p.wil, r.yr1Cover, p.jenis, p.otrNet) * p.otrNet;
  if (p.insPay === 'KREDIT FULL'){ r.insKredit = r.insFull; r.insTunai = 0; }
  else if (p.insPay === 'TUNAI TAHUN 1'){ r.insKredit = r.insFull - r.insYr1; r.insTunai = r.insYr1; }
  else { r.insKredit = 0; r.insTunai = r.insFull; }
  // ACP
  const base = r.ph + r.insKredit;
  const acpRaw = (p.tenor > 1 ? 0.0175 : 0.0075) * (base * r.bunga * p.tenor + base);
  r.acpAmt = p.acp === 'YA' ? ceilTo(acpRaw, 1000) : 0;
  r.acpKredit = p.acpPay === 'KREDIT' ? r.acpAmt : 0;
  r.acpTunai  = p.acpPay === 'TUNAI'  ? r.acpAmt : 0;
  r.pokok = r.ph + r.insKredit + r.acpKredit;
  r.bungaRaw = r.bunga * p.tenor * r.pokok;
  r.bungaRp = ceilTo(r.bungaRaw, 1000);
  r.hutang = r.pokok + r.bungaRp;
  r.angs = ceilTo(r.hutang / r.n, 1000);
  r.angs10 = ceilTo(r.angs, 10000);
  r.nBayar = p.addm === 'ADDM' ? r.n - 1 : r.n;
  r.angs1 = p.addm === 'ADDM' ? r.angs : 0;
  r.provisiRp = p.provisi * r.ph;
  r.tdp = r.dp + r.angs1 + r.insTunai + r.acpTunai + p.admin + p.polis + r.provisiRp;
  return r;
}

/* Benefit dealer & OJK (mengikuti sheet "Itungan Manual") */
function benefit(p, r){
  const b = {};
  const refund = num('refund')/100, assAcc = num('assAcc')/100, admStd = parseRp($('admStd').value);
  b.pdc = p.bPdc > 0 ? (r.ph * p.tenor * p.bPdc) / (1 + (r.bunga - p.bPdc) * p.tenor) : 0;
  b.refund = r.insRate * p.otrNet * refund;
  b.prov = p.provisi * r.pokok;
  b.total = b.pdc + b.refund + b.prov;
  b.accBunga = r.pokok * r.bunga * p.tenor;
  b.accAss = r.insRate * p.otrNet * assAcc;
  b.accProv = r.provisiRp;
  b.accAdm = p.admin;
  b.accTotal = b.accBunga + b.accAss + b.accProv + b.accAdm;
  b.ratio = b.accTotal ? b.total / b.accTotal : 0;
  b.admSelisih = p.admin - admStd;
  b.sPdc = b.pdc * num('spPdc')/100;
  b.sAdm = Math.max(0, b.admSelisih) * num('spAdm')/100;
  b.sRef = b.refund * num('spRef')/100;
  b.sProv = b.prov * num('spProv')/100;
  b.sTotal = b.sPdc + b.sAdm + b.sRef + b.sProv;
  return b;
}

/* Counter rate */
function counterRate(p, dpPct, kat){
  const tbl = DATA.cr[p.addm][kat]; const ti = [12,24,36,48,60].indexOf(p.tenor*12) + 1;
  const row = tbl.find(rw => dpPct + 1e-6 > rw[0]);
  if (!row || row[ti] == null) return null;
  const add = {C1:0,C2:.0025,C3:.005,C4:.01}[p.lvl] || 0;
  return {base: row[ti], add, rate: row[ti] + add, band: row[0]};
}

/* Bunga efektif dari flat (RATE Excel) */
function effRate(flat, years, adv){
  const n = years*12, pmt = (1 + flat*years)/n;
  const f = r => { if (Math.abs(r) < 1e-12) return 1 - pmt*n; const a = (1 - Math.pow(1+r,-n))/r; return 1 - pmt*a*(adv?1+r:1); };
  let lo = 0, hi = 1;
  for (let i=0;i<200;i++){ const m=(lo+hi)/2; if (f(m) > 0) hi = m; else lo = m; }
  return 12 * (lo+hi)/2;
}

/* Cari DP */
function solveByAngs(p, target){
  let lo = 0, hi = Math.floor(p.otrNet/1000);
  if (calc(p, hi*1000).angs > target) return null;
  while (lo < hi){ const m = (lo+hi) >> 1; if (calc(p, m*1000).angs <= target) hi = m; else lo = m+1; }
  return lo*1000;
}
function solveByTdp(p, target){
  let lo = 0, hi = Math.floor(p.otrNet/1000);
  if (calc(p, 0).tdp > target) return null;
  while (lo < hi){ const m = (lo+hi+1) >> 1; if (calc(p, m*1000).tdp <= target) lo = m; else hi = m-1; }
  return lo*1000;
}


/* ---------- tampilan ---------- */
let state = {tab:'angs', basis:'angs'}, last = {};
function row(label, val, note=''){ return `<tr><td>${label}${note?`<small>${note}</small>`:''}</td><td class="v">${val}</td></tr>`; }

function alertsFor(p, r){
  const al = [];
  if (r.dp < 0) al.push(['bad','DP lebih besar dari harga OTR.']);
  else if (r.dpPct < 0.15) al.push(['bad',`DP ${pct(r.dpPct,1)} di bawah 15%.`]);
  else if (p.jenis==='PASSENGER' && r.dpPct < 0.2) al.push(['','DP di bawah 20% untuk passenger. Cek ketentuan uang muka minimum.']);
  if (r.crLow && p.bAuto) al.push(['',`DP di bawah tabel counter rate, bunga memakai band DP ${pct(r.crLow.band,0)}.`]);
  if (p.bPdc > 0.02 + 1e-9) al.push(['bad',`Benefit PDC ${pct(p.bPdc)} melebihi maksimal 2%.`]);
  const b = benefit(p, r); if (b.ratio > 0.15) al.push(['bad',`Benefit dealer ${pct(b.ratio)} melebihi batas OJK 15%.`]);
  return al.map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join('');
}
function rincian(p, r){
  return `<details><summary>Rincian perhitungan</summary><table class="rows"><tbody>` +
    row('Harga OTR nett', fmt(p.otrNet), p.disc ? `OTR ${fmt(p.otr)} − discount ${fmt(p.disc)}` : '') +
    row('DP', fmt(r.dp), pct(r.dpPct)) +
    row('Pokok hutang', fmt(r.ph)) +
    row('Premi asuransi', fmt(r.insKredit), `${p.cover} · ${p.insPay}`) +
    (r.acpKredit ? row('Premi ACP', fmt(r.acpKredit)) : '') +
    row('Jumlah pokok hutang', fmt(r.pokok)) +
    row('Bunga flat', fmt(r.bungaRp), `${pct(r.bunga)} × ${p.tenor} th (counter ${pct(r.bCounter)} + PDC ${pct(p.bPdc)})`) +
    row('Jumlah hutang', fmt(r.hutang), `÷ ${r.n} bulan`) +
    `<tr class="sum"><td>Angsuran / bulan<small>${p.addm} · ${r.nBayar}x</small></td><td class="v">${fmt(r.angs)}</td></tr>` +
    `<tr class="sec"><td colspan="2">Total bayar pertama</td></tr>` +
    row('Uang muka (DP)', fmt(r.dp)) +
    (r.angs1 ? row('Angsuran I', fmt(r.angs1), 'ADDM') : '') +
    (r.insTunai ? row('Asuransi tunai', fmt(r.insTunai)) : '') +
    (r.acpTunai ? row('Premi ACP tunai', fmt(r.acpTunai)) : '') +
    row('Biaya admin', fmt(p.admin)) +
    row('Biaya polis', fmt(p.polis)) +
    (r.provisiRp ? row('Provisi', fmt(r.provisiRp)) : '') +
    `<tr class="sum"><td>Total bayar pertama</td><td class="v">${fmt(r.tdp)}</td></tr></tbody></table></details>`;
}
function chips(p, r){
  return `<div class="chips"><span class="chip">Bunga ${pct(r.bunga)} flat</span><span class="chip">${esc(p.kat)}</span><span class="chip">${esc(p.cover)}</span></div>`;
}
const ACT = k => `<div class="actions"><button class="btn" data-wa="${k}">Salin untuk WA</button><button class="btn ghost" data-share="${k}">Bagikan…</button></div>`;

function render(){
  const p = inputs();
  const rA = calc(p);
  const target = parseRp($('tAngs').value);
  const dpS = target > 0 ? solveByAngs(p, target) : null;
  const rD = dpS != null ? calc(p, dpS) : null;
  last = {p, rA, rD, target};

  $('topSub').textContent = `ACC ${p.cab} · ${p.bAuto ? 'bunga otomatis' : 'bunga manual'}`;
  $('dpEcho').textContent = p.dpMode === 'pct' ? `= ${rp(rA.dp)}` : `= ${pct(rA.dpPct)} dari OTR nett`;

  // Cari Angsuran
  $('resAngs').innerHTML = `<div class="k">Angsuran per bulan</div><div class="v">${rp(rA.angs)}</div>
    <div class="s">${rA.nBayar}x · ${p.addm}${rA.angs10 !== rA.angs ? ` · dibulatkan ${rp(rA.angs10)}` : ''}</div>
    <div class="stats"><div><span>Total bayar pertama</span><b>${rp(rA.tdp)}</b></div><div><span>DP</span><b>${rp(rA.dp)}</b></div></div>
    ${chips(p, rA)}<div class="alerts">${alertsFor(p, rA)}</div>${rincian(p, rA)}${ACT('angs')}`;

  // Cari DP
  if (!target) $('resDp').innerHTML = `<div class="k">DP yang dibutuhkan</div><p class="hint">Isi angsuran yang diinginkan konsumen.</p>`;
  else if (!rD) $('resDp').innerHTML = `<div class="k">DP yang dibutuhkan</div><div class="v" style="font-size:22px">Tidak tercapai</div><p class="hint">Angsuran ${rp(target)} terlalu kecil untuk OTR dan tenor ini.</p>`;
  else $('resDp').innerHTML = `<div class="k">DP yang dibutuhkan</div><div class="v">${rp(rD.dp)}</div>
    <div class="s"><span class="pill ${rD.dpPct<0.15?'bad':rD.dpPct<0.2?'warn':'good'}">${pct(rD.dpPct,1)}</span> dari OTR nett</div>
    <div class="stats"><div><span>Total bayar pertama</span><b>${rp(rD.tdp)}</b></div><div><span>Angsuran ${rD.nBayar}x</span><b>${rp(rD.angs)}</b></div></div>
    ${chips(p, rD)}<div class="alerts">${alertsFor(p, rD)}</div>${rincian(p, rD)}${ACT('dp')}`;

  // PDC (berdasarkan tab hitung terakhir)
  const r = state.basis === 'dp' && rD ? rD : rA, b = benefit(p, r);
  $('pdcCtx').innerHTML = `Berdasarkan hitungan di tab <b>${state.basis === 'dp' && rD ? 'Cari DP' : 'Cari Angsuran'}</b>: ${esc($('type').value || 'unit')} · OTR <b>${rp(p.otrNet)}</b> · DP <b>${rp(r.dp)}</b> (${pct(r.dpPct,1)}) · ${p.tenor} th ${p.addm} · angsuran <b>${rp(r.angs)}</b>`;
  $('pdcBunga').textContent = pct(r.bunga);
  $('pdcInfo').textContent = `Counter ${pct(r.bCounter)} + PDC ${pct(p.bPdc)} = ${pct(r.bunga)} flat per tahun.`;
  $('bPdc').classList.toggle('over', p.bPdc > 0.02 + 1e-9);
  $('pdcAlert').innerHTML = p.bPdc > 0.02 + 1e-9 ? `<div class="alert bad">PDC ${pct(p.bPdc)} melebihi maksimal 2%. Turunkan ke 2% atau kurang.</div>` : '';
  const ok = b.ratio <= 0.15;
  $('ojkPct').textContent = pct(b.ratio);
  $('ojkPill').className = 'pill ' + (ok ? 'good' : 'bad');
  $('ojkPill').textContent = ok ? 'Aman' : 'Melebihi 15%';
  $('ojkBar').style.width = Math.min(100, b.ratio/0.30*100) + '%';
  $('ojkBar').className = ok ? '' : 'bad';
  $('benRows').innerHTML =
    `<tr class="sec"><td colspan="2">Benefit dealer</td></tr>` +
    row('PDC balik', fmt(b.pdc), `PH × ${p.tenor} × ${pct(p.bPdc)} ÷ (1 + ${pct(r.bCounter)} × ${p.tenor})`) +
    (b.refund ? row('Refund asuransi', fmt(b.refund)) : '') +
    (b.prov ? row('Provisi', fmt(b.prov)) : '') +
    `<tr class="sum"><td>Total benefit dealer</td><td class="v">${fmt(b.total)}</td></tr>` +
    `<tr class="sec"><td colspan="2">Pendapatan ACC</td></tr>` +
    row('Bunga', fmt(b.accBunga)) + row('Asuransi', fmt(b.accAss), `${num('assAcc')}% dari premi`) +
    (b.accProv ? row('Provisi', fmt(b.accProv)) : '') + row('Admin', fmt(b.accAdm)) +
    `<tr class="sum"><td>Total pendapatan ACC</td><td class="v">${fmt(b.accTotal)}</td></tr>` +
    `<tr class="sec"><td colspan="2">Untuk salesman</td></tr>` +
    row('Dari PDC', fmt(b.sPdc), `split ${num('spPdc')}%`) +
    (b.sAdm ? row('Dari selisih admin', fmt(b.sAdm)) : '') + (b.sRef ? row('Dari refund asuransi', fmt(b.sRef)) : '') + (b.sProv ? row('Dari provisi', fmt(b.sProv)) : '') +
    `<tr class="sum"><td>Total salesman</td><td class="v">${fmt(b.sTotal)}</td></tr>`;

  // Pengaturan
  if (rA.bAutoOk) $('bCounter').value = +(rA.bCounter*100).toFixed(4);
  $('bCounter').readOnly = p.bAuto;
  $('insInfo').textContent = `Tarif ${p.cover}: ${pct(rA.insRate,3)} dari OTR nett · ${p.wil}`;
  renderRef(p, rA);
  save();
}
function renderRef(p, r){
  const cr = r.cr, tbl = DATA.cr[p.addm][p.kat], ti = [12,24,36,48,60].indexOf(p.tenor*12)+1, add = {C1:0,C2:.0025,C3:.005,C4:.01}[p.lvl]||0;
  const band = (cr || r.crLow || {}).band;
  $('crInfo').textContent = `${p.kat} · ${p.addm} · ${p.cab} level ${p.lvl}${add?` (+${pct(add)})`:''}. Sel yang disorot = DP ${pct(r.dpPct,0)} dan tenor ${p.tenor*12} bulan di tab Cari Angsuran.`;
  $('crTbl').innerHTML = `<tr><th>DP ≥</th><th>12</th><th>24</th><th>36</th><th>48</th><th>60</th></tr>` +
    tbl.map(rw => `<tr><td>${pct(rw[0],0)}</td>${[1,2,3,4,5].map(i=>`<td class="${rw[0]===band && i===ti?'hit':''}">${rw[i]==null?'—':pct(rw[i]+add)}</td>`).join('')}</tr>`).join('');
  $('effRows').innerHTML = row('Bunga jual flat → efektif', `${pct(r.bunga)} → ${pct(effRate(r.bunga, p.tenor, p.addm==='ADDM'))}`) +
    row('Counter flat → efektif', `${pct(r.bCounter)} → ${pct(effRate(r.bCounter, p.tenor, p.addm==='ADDM'))}`);
}

/* ---------- teks WhatsApp ---------- */
function waText(k){
  const {p} = last, r = k === 'dp' ? last.rD : last.rA;
  if (!r) return '';
  const L = ['*SIMULASI KREDIT*'];
  if ($('nama').value) L.push('Konsumen: ' + $('nama').value);
  if ($('type').value) L.push('Unit: DAIHATSU ' + $('type').value);
  L.push('');
  L.push(`Harga OTR: ${rp(p.otrNet)}`);
  L.push(`DP: ${rp(r.dp)} (${pct(r.dpPct,1)})`);
  L.push(`Tenor: ${p.tenor} tahun (${r.nBayar}x, ${p.addm})`);
  L.push(`Asuransi: ${p.cover}`);
  L.push('');
  L.push(`*Angsuran: ${rp(r.angs)} / bulan*`);
  L.push(`*Total bayar pertama: ${rp(r.tdp)}*`);
  const rinci = [r.angs1 ? `angsuran I ${rp(r.angs1)}` : '', r.insTunai ? `asuransi ${rp(r.insTunai)}` : '', r.acpTunai ? `ACP ${rp(r.acpTunai)}` : ''].filter(Boolean);
  if (rinci.length) L.push(`  DP ${rp(r.dp)} + ${rinci.join(' + ')}`);
  L.push('');
  L.push('_Simulasi, dapat berubah sesuai ketentuan leasing._');
  return L.join('\n');
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Teks disalin. Tempel di WhatsApp.');}catch(e){toast('Gagal menyalin.');} ta.remove(); }
document.addEventListener('click', e => {
  const w = e.target.closest('[data-wa]');
  if (w){ const t = waText(w.dataset.wa); if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Teks disalin. Tempel di WhatsApp.'), ()=>fallbackCopy(t)); else fallbackCopy(t); return; }
  const s = e.target.closest('[data-share]');
  if (s){ const t = waText(s.dataset.share);
    if (navigator.share) navigator.share({title:'Simulasi Kredit', text:t}).catch(()=>{});
    else { if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Bagikan tidak tersedia, teks disalin.'), ()=>fallbackCopy(t)); else fallbackCopy(t); } }
});

  $('dpPct').hidden = v !== 'pct'; $('dpRp').hidden = v !== 'rp';
});
$('jenis').addEventListener('change', () => { fillCover($('jenis').value === 'PASSENGER' ? '-' : `${segVal('tenorSeg')} thn TLO`); render(); });
function katDariType(t){
  const T = String(t).toUpperCase().replace(/\s+/g,' ');
  if (/GRAN ?MAX|GRANDMAX|\bGM ?(PU|BV|MB)\b/.test(T)){
    if (/\bMB\b|MINIBUS/.test(T)) return {kat:'COMMERCIAL 1', jenis:'PASSENGER'};
    return {kat:'COMMERCIAL 1', jenis:'TRUCK / PU / BOX'};
  }
  if (/\b(PU|PICK ?UP|BV|BLIND ?VAN|BOX)\b/.test(T)) return {kat:'COMMERCIAL 1', jenis:'TRUCK / PU / BOX'};
  if (/AYLA|SIGRA/.test(T)) return {kat:'REGULAR 2', jenis:'PASSENGER'};
  if (T.trim()) return {kat:'REGULAR 1', jenis:'PASSENGER'};
  return null;
}
$('type').addEventListener('input', () => {
  const k = katDariType($('type').value); if (!k) return;
  $('kat').value = k.kat;
  if ($('jenis').value !== k.jenis){ $('jenis').value = k.jenis; fillCover(k.jenis === 'PASSENGER' ? '-' : `${segVal('tenorSeg')} thn TLO`); }
  $('katInfo').textContent = `Otomatis dari type: ${k.kat} · ${k.jenis}. Bisa diganti di sini.`;
  render();
});

function showTab(t){
  state.tab = t; if (t === 'angs' || t === 'dp') state.basis = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('[data-tab-view]').forEach(v => v.classList.toggle('on', v.dataset.tabView.split(' ').includes(t)));
  render(); window.scrollTo(0,0);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });

/* ---------- simpan di perangkat ---------- */
const KEEP = ['type','otr','dpPct','dpRp','tAngs','bPdc','refund','provisi','spPdc','spAdm','spRef','spProv','cabang','kat','bCounter','jenis','insPay','acp','acpPay','disc','admin','polis','admStd','assAcc','nama'];
const KEY = 'accHitung3';
function save(){ try{ const o = {}; KEEP.forEach(k => o[k] = $(k).value); o.cover = $('cover').value; o.tenor = segVal('tenorSeg'); o.addm = segVal('addm'); o.bMode = segVal('bMode'); o.dpMode = segVal('dpMode'); o.tab = state.tab; o.basis = state.basis; localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function load(){
  let o = null; try{ o = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if (!o) return;
  ['tenor','addm','bMode','dpMode'].forEach(k => { if (o[k]) setSeg({tenor:'tenorSeg',addm:'addm',bMode:'bMode',dpMode:'dpMode'}[k], o[k]); });
  KEEP.forEach(k => { if (o[k] != null) $(k).value = o[k]; });
  fillCover(o.cover);
  const m = segVal('dpMode'); $('dpPct').hidden = m !== 'pct'; $('dpRp').hidden = m !== 'rp';
  if (o.basis) state.basis = o.basis;
  return o.tab;
}
$('btnReset').addEventListener('click', () => {
  if ($('btnReset').dataset.sure !== '1'){ $('btnReset').dataset.sure = '1'; $('btnReset').textContent = 'Ketuk sekali lagi untuk mengembalikan'; setTimeout(()=>{ $('btnReset').dataset.sure=''; $('btnReset').textContent='Kembalikan pengaturan awal'; }, 3000); return; }
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
});

// Service worker (mode luring saat dipasang sebagai aplikasi)
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) navigator.serviceWorker.register('sw.js'); } catch(e){}

fillCabang(); fillCover('1 thn AR, 4 thn TLO');
const tab0 = load();
showTab(['angs','dp','pdc','set'].includes(tab0) ? tab0 : 'angs');
